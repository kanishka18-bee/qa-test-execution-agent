<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QA Test Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F7F5;
    --panel: #FFFFFF;
    --ink: #1A1D21;
    --ink-soft: #565B63;
    --line: #D8DAD6;
    --pass: #1F7A4D;
    --fail: #B23B2E;
    --signal: #1E4FD8;
    --pending: #9A9D93;
    font-family: 'IBM Plex Sans', -apple-system, Segoe UI, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { padding: 48px 40px 80px; }

  .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace; }

  header { max-width: 1180px; margin: 0 auto 40px; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
  header h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--ink-soft); font-size: 0.92rem; max-width: 54ch; line-height: 1.5; }

  main { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 340px 1fr; gap: 0; border: 1px solid var(--line); background: var(--panel); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  .bench { padding: 28px; border-right: 1px solid var(--line); }
  @media (max-width: 820px) { .bench { border-right: none; border-bottom: 1px solid var(--line); } }

  .bench h2, .log h2 { font-size: 0.78rem; font-weight: 600; margin: 0 0 20px; color: var(--ink-soft); }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 6px; }
  .field input, .field textarea {
    width: 100%; border: none; border-bottom: 1px solid var(--line); background: transparent;
    padding: 6px 0; font-size: 0.9rem; font-family: inherit; color: var(--ink); resize: vertical;
  }
  .field textarea { min-height: 64px; line-height: 1.5; }
  .field input:focus, .field textarea:focus { outline: none; border-bottom-color: var(--signal); }

  .run-btn {
    margin-top: 8px; width: 100%; padding: 11px; background: var(--signal); color: white;
    border: none; font-family: inherit; font-size: 0.88rem; font-weight: 500; cursor: pointer;
  }
  .run-btn:disabled { background: var(--pending); cursor: default; }
  .run-btn:not(:disabled):hover { background: #17399e; }

  .log { padding: 28px; min-width: 0; }
  .run-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
  .run-id { color: var(--ink-soft); font-size: 0.82rem; }
  .run-status { font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pending); flex-shrink: 0; }
  .dot.running { background: var(--signal); }
  .dot.passed { background: var(--pass); }
  .dot.failed, .dot.error { background: var(--fail); }

  .empty { color: var(--ink-soft); font-size: 0.88rem; padding: 8px 0; }

  .step-row { display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); align-items: flex-start; }
  .step-row:first-child { border-top: none; }
  .step-bar { width: 3px; align-self: stretch; min-height: 20px; background: var(--pending); flex-shrink: 0; }
  .step-bar.pass { background: var(--pass); }
  .step-bar.fail { background: var(--fail); }
  .step-body { flex: 1; min-width: 0; }
  .step-desc { font-size: 0.88rem; margin-bottom: 3px; }
  .step-action { font-size: 0.78rem; color: var(--ink-soft); word-break: break-word; }
  .step-time { font-size: 0.78rem; color: var(--ink-soft); flex-shrink: 0; }
  .elapsed { color: var(--ink-soft); font-size: 0.82rem; margin-left: 6px; }

  .verdict { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  .verdict-label { font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 6px; }
  .verdict-text.pass { color: var(--pass); }
  .verdict-text.fail { color: var(--fail); }
  .fallback-note { margin-top: 8px; font-size: 0.78rem; color: var(--signal); }
</style>
</head>
<body>

<header>
  <h1>QA Test Bench</h1>
  <p>Define a test case, run it through the agent, and read the step-by-step result — each action the agent took, and why it passed or failed.</p>
</header>

<main>
  <section class="bench">
    <h2>Test case</h2>

    <div class="field">
      <label for="title">Title</label>
      <input id="title" value="User can log in with valid credentials" />
    </div>

    <div class="field">
      <label for="start_url">Start URL</label>
      <input id="start_url" class="mono" value="https://example.com/login" />
    </div>

    <div class="field">
      <label for="steps">Steps, one per line</label>
      <textarea id="steps">Enter 'demo_user' into the username field
Click the login button</textarea>
    </div>

    <div class="field">
      <label for="expected_result">Expected result</label>
      <textarea id="expected_result" style="min-height:44px">The dashboard page is shown with a welcome message</textarea>
    </div>

    <button class="run-btn" id="submit">Run test</button>
  </section>

  <section class="log">
    <h2>Run</h2>

    <div id="run-head-wrap" style="display:none">
      <div class="run-head">
        <span class="run-id mono" id="run-id"></span>
        <span class="run-status"><span class="dot" id="status-dot"></span><span id="status-text"></span><span class="elapsed mono" id="elapsed"></span></span>
      </div>
      <div id="steps-out"></div>
      <div class="verdict" id="verdict-wrap" style="display:none">
        <div class="verdict-label">Verdict</div>
        <div class="verdict-text mono" id="verdict-text"></div>
        <div class="fallback-note mono" id="fallback-note" style="display:none">used backup model (primary failed)</div>
      </div>
    </div>

    <div class="empty" id="empty-state">No run yet. Fill in a test case and press run.</div>
  </section>
</main>

<script>
const API_BASE = "";
let ticker = null;

document.getElementById("submit").addEventListener("click", async () => {
  const btn = document.getElementById("submit");
  btn.disabled = true;
  btn.textContent = "Running…";

  document.getElementById("empty-state").style.display = "none";
  document.getElementById("run-head-wrap").style.display = "block";
  document.getElementById("steps-out").innerHTML = "";
  document.getElementById("verdict-wrap").style.display = "none";
  document.getElementById("fallback-note").style.display = "none";
  setStatus("queued");

  const startedAt = performance.now();
  clearInterval(ticker);
  ticker = setInterval(() => {
    document.getElementById("elapsed").textContent = ((performance.now() - startedAt) / 1000).toFixed(1) + "s";
  }, 100);

  const payload = {
    test_case: {
      title: document.getElementById("title").value,
      start_url: document.getElementById("start_url").value,
      steps: document.getElementById("steps").value.split("\n").map(s => s.trim()).filter(Boolean),
      expected_result: document.getElementById("expected_result").value
    }
  };

  try {
    const createRes = await fetch(`${API_BASE}/test-runs`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!createRes.ok) throw new Error(`request failed (${createRes.status})`);
    const created = await createRes.json();
    document.getElementById("run-id").textContent = created.run_id;
    await poll(created.run_id);
  } catch (err) {
    clearInterval(ticker);
    setStatus("error");
    document.getElementById("verdict-wrap").style.display = "block";
    document.getElementById("verdict-text").textContent = err.message;
    document.getElementById("verdict-text").className = "verdict-text mono fail";
  } finally {
    btn.disabled = false;
    btn.textContent = "Run test";
  }
});

async function poll(runId) {
  const terminal = new Set(["passed", "failed", "error"]);
  for (let i = 0; i < 90; i++) {
    const res = await fetch(`${API_BASE}/test-runs/${runId}`);
    const data = await res.json();
    render(data);
    if (terminal.has(data.status)) return;
    await new Promise(r => setTimeout(r, 2000));
  }
}

function setStatus(status) {
  const dot = document.getElementById("status-dot");
  dot.className = "dot " + status;
  document.getElementById("status-text").textContent = status;
}

function render(data) {
  setStatus(data.status);

  const stepsOut = document.getElementById("steps-out");
  stepsOut.innerHTML = "";
  (data.step_results || []).forEach(s => {
    const row = document.createElement("div");
    row.className = "step-row";
    row.innerHTML = `
      <div class="step-bar ${s.success ? "pass" : "fail"}"></div>
      <div class="step-body">
        <div class="step-desc">${escapeHtml(s.step)}</div>
        <div class="step-action mono">${escapeHtml(s.action_taken)}</div>
      </div>
      <div class="step-time mono">${s.duration_ms} ms</div>`;
    stepsOut.appendChild(row);
  });

  if (["passed", "failed", "error"].includes(data.status)) {
    const wrap = document.getElementById("verdict-wrap");
    const text = document.getElementById("verdict-text");
    clearInterval(ticker);
    document.getElementById("elapsed").textContent =
      data.duration_seconds.toFixed(1) + "s, " + data.llm_calls + " LLM calls, " +
      (data.input_tokens + data.output_tokens) + " tokens";
    wrap.style.display = "block";
    text.textContent = data.verdict_reason || data.error || "—";
    text.className = "verdict-text mono " + (data.status === "passed" ? "pass" : "fail");
    document.getElementById("fallback-note").style.display = data.used_fallback ? "block" : "none";
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}
</script>

</body>
</html>
